name: Release

# Push a tag like v1.0.0 to publish the app on the repository's Releases page:
# the single HTML file, a zip with the fake example folder, and their SHA-256
# checksums. The tag must match the version in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run deadcode && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit && npx playwright test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/index.html apartment-packet-builder.html
          mkdir "Apartment Packet Builder"
          cp apartment-packet-builder.html "Apartment Packet Builder/"
          cp -R "example/Apartment Docs" "Apartment Packet Builder/Example Apartment Docs"
          zip -qrX apartment-packet-builder.zip "Apartment Packet Builder"
          sha256sum apartment-packet-builder.html apartment-packet-builder.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" apartment-packet-builder.html apartment-packet-builder.zip SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
