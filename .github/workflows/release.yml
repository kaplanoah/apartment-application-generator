name: Release

# Publishes the app on the repository's Releases page: the single HTML file, a
# zip with the fake example folder, and their SHA-256 checksums. Start it with
# "Run workflow" on main (the version comes from package.json), or by pushing a
# tag that matches package.json, like v1.0.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Work out the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version)."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run deadcode && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit && npx playwright test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/index.html apartment-packet-builder.html
          mkdir "Apartment Packet Builder"
          cp apartment-packet-builder.html "Apartment Packet Builder/"
          cp -R "example/Apartment Docs" "Apartment Packet Builder/Example Apartment Docs"
          zip -qrX apartment-packet-builder.zip "Apartment Packet Builder"
          sha256sum apartment-packet-builder.html apartment-packet-builder.zip > SHA256SUMS
          # Creates the tag at this commit if it doesn't exist; refuses a version already released.
          gh release create "$VERSION" apartment-packet-builder.html apartment-packet-builder.zip SHA256SUMS \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
