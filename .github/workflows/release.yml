name: Release

# Publishes the app on the repository's Releases page whenever main gets a version
# in package.json that hasn't been released yet, which is what merging a pull
# request with a version bump does. "Run workflow" on main does the same by hand.
# Each release has the single HTML file, a zip with the fake example folder, and
# their SHA-256 checksums.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Is this version released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          version="v$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $version."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run deadcode && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit && npx playwright test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/index.html apartment-packet-builder.html
          mkdir "Apartment Packet Builder"
          cp apartment-packet-builder.html "Apartment Packet Builder/"
          cp -R "example/Apartment Docs" "Apartment Packet Builder/Example Apartment Docs"
          zip -qrX apartment-packet-builder.zip "Apartment Packet Builder"
          sha256sum apartment-packet-builder.html apartment-packet-builder.zip > SHA256SUMS
          # Creates the tag at this commit; refuses a version that's already released.
          gh release create "$VERSION" apartment-packet-builder.html apartment-packet-builder.zip SHA256SUMS \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
