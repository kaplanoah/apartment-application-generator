name: Release

# Push a tag like v1.0.0 to publish the single HTML file, with its SHA-256
# checksum, on the repository's Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit && npx playwright test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/index.html apartment-packet-builder.html
          sha256sum apartment-packet-builder.html > apartment-packet-builder.html.sha256
          gh release create "$GITHUB_REF_NAME" apartment-packet-builder.html apartment-packet-builder.html.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
