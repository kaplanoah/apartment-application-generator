name: CI

# Checks every pull request, and publishes a release when main gets a new version.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Re-runs the checks on main, and releases its version if that hasn't happened yet.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the checks still running on the one before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deadcode

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The runner is on UTC. Date ranges depend on the viewer's day, so check far
      # behind and far ahead of it too.
      - name: Test in other time zones
        run: TZ=Pacific/Honolulu npm test && TZ=Pacific/Kiritimati npm test

  # The single built file. The browser tests run against it, the version check compares
  # it with main's, and a release publishes exactly this file. It's also there for
  # trying a pull request's version without building it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apartment-packet-builder
          path: dist/index.html
          if-no-files-found: error

  # The browser tests take most of CI's time, so each engine runs on its own machine.
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apartment-packet-builder
          path: dist
      - run: npx playwright install --with-deps ${{ matrix.project == 'chromium' && '--only-shell chromium' || 'webkit' }}
      - run: npx playwright test --project=${{ matrix.project }}
      # The page as each failed test last saw it, so a failure can be understood from the log.
      - name: Show the page at each failure
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "::group::$1"; cat "$1"; echo "::endgroup::"' _ {} \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/

  # Says whether merging releases a new version, and fails when the built app changes
  # without a version bump. Merging a bump publishes the release (see the release job).
  version:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apartment-packet-builder
          path: dist
      - name: Build the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE_REF"
          cd "$RUNNER_TEMP/base" && npm ci && npm run build
      - run: npx tsx scripts/check-version.ts
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_BUILD: ${{ runner.temp }}/base/dist/index.html
          HEAD_BUILD: dist/index.html

  # One of the two checks to require before merging, with review.yml's review. It runs
  # even when a job fails, because GitHub counts a skipped required check as passing.
  check:
    if: always()
    needs: [static, test, build, browser, version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # Publishes the file the checks just passed on the Releases page, when main has a
  # version that isn't released yet. Each release has the single HTML file, a zip with
  # the fake example folder, and their SHA-256 checksums. This job runs no npm code,
  # so nothing installed from the registry ever holds its write access.
  release:
    needs: check
    if: always() && needs.check.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One release at a time. Runs queued behind it collapse to the newest, which
    # releases the newest version; a version merged in between is skipped.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apartment-packet-builder
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="v$(jq -r .version package.json)"
          cp dist/index.html apartment-packet-builder.html
          built="$(sha256sum apartment-packet-builder.html | cut -d ' ' -f 1)"

          if gh release view "$version" > /dev/null 2>&1; then
            gh release download "$version" --pattern SHA256SUMS --output released.sums
            released="$(awk '$2 == "apartment-packet-builder.html" { print $1 }' released.sums)"
            if [ "$released" = "$built" ]; then
              echo "$version is already released, and the app hasn't changed since."
              exit 0
            fi
            echo "::error::The app on main differs from the released $version, but the version wasn't bumped. Open a pull request that runs npm version patch --no-git-tag-version."
            exit 1
          fi

          # gh fails when there's no such tag, which is the usual case.
          if tagged="$(gh api "repos/$GH_REPO/git/ref/tags/$version" --jq .object.sha 2> /dev/null)" &&
            [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $version already exists at $tagged, not at this commit. Delete the tag or bump the version."
            exit 1
          fi

          echo "Releasing $version."
          mkdir "Apartment Packet Builder"
          cp apartment-packet-builder.html "Apartment Packet Builder/"
          cp -R "example/Apartment Docs" "Apartment Packet Builder/Apartment Docs"
          zip -qrX apartment-packet-builder.zip "Apartment Packet Builder"
          sha256sum apartment-packet-builder.html apartment-packet-builder.zip > SHA256SUMS
          gh release create "$version" apartment-packet-builder.html apartment-packet-builder.zip SHA256SUMS \
            --target "$GITHUB_SHA" --title "$version" --generate-notes
